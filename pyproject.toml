[project]
name = "atlas-files"
version = "0.1.0"
description = "A shared multimodal file workspace with Gemini, Datastore and MCP"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.8,<3", "google-genai>=1.66,<2", "google-auth>=2.40,<3", "google-cloud-datastore>=2.21,<3",
  "google-cloud-storage>=3,<4", "google-cloud-run>=0.10,<1", "mcp>=1.26,<2",
  "numpy>=2.1,<3", "umap-learn>=0.5.7,<0.6", "pillow>=11,<13", "pypdf>=6,<7",
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["backend/atlas"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
